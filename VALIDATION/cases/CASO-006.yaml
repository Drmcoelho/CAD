      chronicityHint: null
      pesoKg: null
    disponibilidade: {}
    observacoes: >-
      Cetonemia relatada como "positive ketonemia, i.e. 1.39" SEM unidade
      declarada em nenhum lugar do texto -> betaHydroxybutyrateMmolL null
      (valor com unidade desconhecida não entra; mesmo padrão do caso
      alpelisibe descartado). Sem cetonúria quantificada -> eixo cetônico
      do motor fica sem insumo. Ureia "23" sem unidade explícita, assumida
      mg/dL pelo padrão do laboratório paquistanês em mg/dL (glicose em
      mg/dL no mesmo painel); registrado aqui em ureaMgDl. Gasometria
      ARTERIAL (pO2 115). BE -21,3.
