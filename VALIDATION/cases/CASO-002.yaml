conduta_relatada:
  insulina:
    iniciada: true
    adiada_por_potassio: false
    taxa_inicial_U_kg_h: 0.1
    reduzida_com_dextrose: true
    bolus_inicial: null
  potassio:
    reposto_antes_da_insulina: null
    reposto: true
  bicarbonato:
    administrado: true
    ph_no_momento: 7.2
  fluidos:
    texto: "SF 0,9% 2x500 mL com 20 mEq KCl cada, a 100 mL/h, titulado pela diurese"
  texto_livre: >-
    Insulina regular 0,1 U/kg/h em bomba, titulada por K e glicemia;
    suspensa por 4h quando K <3,0 mmol/L; dextrose 50% 50 mL quando
    glicemia <150 (unidade grafada como mmol/L no texto, provável erro
    tipográfico); reduzida para 0,05 U/kg/h após diálise. NaHCO3 100 mEq
    IV. Hemodiálise de resgate por oligúria + K em ascensão; depois
    diálise em dias alternados. Antibiótico para ITU.

desfecho:
