      (qualquer limiar do motor — 200/250/500 — fica igualmente cruzado;
      decisão-equivalente). "Acetone levels were negative" -> cetonúria 0
      (ausência afirmada, não campo em branco). Na/Cl/K/pH/HCO3 não
      publicados por paciente; AG ">20" atribuído pelo relato à uremia da
      ESRD. Segundo caso dialítico do corpus (CASO-002 é o outro);
      hiperglicemia iatrogênica por dexametasona (COVID).

