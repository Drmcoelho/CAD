conduta_relatada:
  insulina:
    iniciada: true
    adiada_por_potassio: false
    taxa_inicial_U_kg_h: 0.05
    reduzida_com_dextrose: null
    bolus_inicial: false
  potassio:
    reposto_antes_da_insulina: null
    reposto: null
  bicarbonato:
    administrado: null
    ph_no_momento: null
  fluidos:
    texto: "ressuscitação volêmica com queda de glicemia controlada em 2-5 mmol/L/h"
  texto_livre: >-
    Insulina IV contínua 0,05-0,1 U/kg/h (faixa relatada; registrado o
    piso). Pancreatite: jejum + somatostatina + omeprazol + HBPM +
    suporte nutricional. Hemodiafiltração venovenosa contínua no dia 2
    para remoção de mediadores inflamatórios (SIRS + acidose de difícil
    correção); sensório clareou e acidose corrigiu após 12h de CVVHDF.
    Insulina SC a partir do dia 8; alta no dia 20.

