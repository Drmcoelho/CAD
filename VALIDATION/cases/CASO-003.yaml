      discussão cita glicose 212 (labs: 214) e HCO3 9 (labs: 6) —
      extração usa o parágrafo de labs. Etanolemia negativa; TC com
      edema peripancreático + lipase 968 (pancreatite); WBC 19,8 mil;
      possível pneumonia multifocal na TC (suspectedSepsis mantido null:
      relato não firma sepse).

