  texto_livre: >-
    Insulina em infusão iniciada a 3 U/h no PS (taxa absoluta; peso não
    relatado), depois protocolo de CAD na UTI com dextrose 5% associada.
    NaHCO3 50 mEq em injeção. Transição para glargina + lispro após
    normalização de glicemia e eletrólitos.

