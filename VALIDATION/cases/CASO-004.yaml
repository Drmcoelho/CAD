conduta_relatada:
  insulina:
    iniciada: true
    adiada_por_potassio: false
    taxa_inicial_U_kg_h: 0.1
    reduzida_com_dextrose: true
    bolus_inicial: false
  potassio:
    reposto_antes_da_insulina: false
    reposto: true
  bicarbonato:
    administrado: null
    ph_no_momento: null
  fluidos:
    texto: "bolus SF 20 mL/kg x2; 100 mL/kg em 36h (SF + Ringer lactato); manutenção com NaCl 0,45% a 2x basal; sistema de 2 bolsas com dextrose 10% titulada para glicemia 100-200"
  texto_livre: >-
    Protocolo de CAD pediátrico (ISPAD): insulina IV contínua 0,1 U/kg/h,
    reduzida em ~6h pela correção da acidose e queda da glicemia; KCl +
    KPhos nas bolsas de manutenção; epinefrina em infusão por choque
    descompensado nas primeiras 48h; transição para SC no dia 3.

