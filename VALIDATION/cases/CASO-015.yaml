conduta_relatada:
  insulina:
    iniciada: true
    adiada_por_potassio: false
    taxa_inicial_U_kg_h: 0.1
    reduzida_com_dextrose: null
    bolus_inicial: false
  potassio:
    reposto_antes_da_insulina: false
    reposto: true
  bicarbonato:
    administrado: true
    ph_no_momento: 6.75
  fluidos:
    texto: "bolus 30 mL/kg SF 0,9% no PS adulto (acima dos 10-20 mL/kg do ISPAD); depois NaCl 0,45% + NaHCO3 75 mEq/L a 150 mL/h; trocado para isotônico com KCl+KPhos sem bicarbonato após consultoria da UTI pediátrica"
  texto_livre: >-
    NaHCO3 50 mEq em bolus no PS com pH 6,75 (DENTRO do gatilho <7,0 do
    canon adulto; a literatura pediátrica associa bicarbonato a edema
    cerebral — o próprio relato discute a contribuição possível). Terapia
    hiperosmolar (salina 3% 5 mL/kg x2 + manitol 0,8 g/kg) por edema
    cerebral; IOT por apneia recorrente; VM até o dia 7.

