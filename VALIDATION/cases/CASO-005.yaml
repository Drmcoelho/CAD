    administrado: null
    ph_no_momento: null
  fluidos:
    texto: "SF 0,9% 2500 mL nas primeiras 2h; total 4 L em 18h (SF + D5 salina)"
  texto_livre: >-
    Insulina IV só iniciada após elevar K de 2,5 para 3,8 mmol/L com
    reposição IV (80 mmol em 4h) — insulina adiada por hipocalemia. Drip
    de 1,5 U/h (taxa absoluta; peso não relatado). Transição para insulina
    SC; suspensão de IV 1h depois; alta no dia 3 com insulina pré-mistura.

