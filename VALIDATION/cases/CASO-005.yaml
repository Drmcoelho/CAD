      dialysisDependent: false
      chronicityHint: null
      pesoKg: null
    disponibilidade:
      betaHydroxybutyrateMmolL: ausente_no_cenario_UPA
    observacoes: >-
      Painel sérico completo (tabela 1): Na 125, K 2,5, Cl 69, HCO3 37,
      AG 19, albumina 4,6, glicose 312 (texto corrido diz 313 — extração
      usa a tabela), βHB 3,4. Gasometria venosa: pH 7,502, pCO2 47,7,
      HCO3 37,6 (extração usa HCO3 sérico 37, base do AG do relato).
      Cetonúria 2+, glicosúria 2+. Urina: Na 32, K 30, Cl <20 (fora dos
      insumos do motor). Relato calcula Na corrigido 128,4.
