    disponibilidade: {}
    observacoes: >-
      Duas fontes no relato: gasometria venosa (pH 7,12, pCO2 38, HCO3 12,
      Na 149, K 3,6, glicose 185, lactato 2,4) e bioquímica sérica (Na 139,
      K 5,0, Cl 102, albumina 43,5 g/L, glicose 190). Extração usa a
      bioquímica para Na/Cl/K/albumina/glicose (é a base do AG=25 que o
      próprio relato calcula: 139-102-12) e a gasometria para pH/pCO2/HCO3.
      Albumina convertida 43,5 g/L -> 4,35 g/dL. suspectedSepsis=false:
      relato afirma septic workup negativo. Relato ainda informa: Na
      corrigido 140, osm sérica 288, cetonúria 3+.

