  texto_livre: >-
    Admitida em UTI; infusão intravenosa de insulina + hidratação IV;
    empagliflozina implicada como causa (suspensa); gasometrias seriadas
    mostraram resolução gradual da cetoacidose com normalização do anion
    gap (valores seriados não publicados). Alta com metformina XR 1 g/dia
    e insulina 70/30 20 U 2x/dia.

