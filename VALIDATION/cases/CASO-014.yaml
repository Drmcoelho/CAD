    observacoes: >-
      Cloro NÃO publicado na tabela; DERIVADO (v0.2, F-004): Cl = Na -
      HCO3 - AG relatado = 137 - 8 - 31 = 98. Cetona sérica publicada
      como "ketone levels 4.5 mmol/L" sem nomear o ensaio — extraída como
      βHB por ser o ensaio sérico padrão reportado em mmol/L; decisão
