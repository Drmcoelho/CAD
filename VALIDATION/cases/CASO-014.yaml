    Protocolo de CAD na UTI: insulina IV contínua 0,1 U/kg/h + reposição
    de potássio + monitorização seriada de cetonas. Empagliflozina
    suspensa imediatamente. Vancomicina 4 semanas + ceftriaxona 7 dias
    (bacteremia MRSA); ecocardiograma sem endocardite; desbridamento de
    abscesso de pé identificado depois. Metoprolol reduzido por
    bradicardia.

