  criterio_resolucao_do_relato: "derangements metabólicos corrigidos precocemente; internação dominada pela mucormicose (104 dias); alta em melhora funcional"
  tempo_ate_resolucao_h: null
  complicacoes: ["mucormicose rinocerebral com cerebrite necrosante e herniação temporal precoce", "craniotomia + desbridamento", "diabetes insipidus central", "hemiparesia esquerda", "nefrotoxicidade por anfotericina", "pneumonia aspirativa", "trombose associada a cateter", "QTc prolongado por posaconazol"]
