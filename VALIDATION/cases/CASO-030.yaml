    observacoes: >-
      Labs esparsos: pH 6,92, pCO2 publicado como "<5 torr" -> registrado
      5 como TETO do publicado (hiperventilação extrema; qualquer
      comparação de compensação fica no mesmo lado), BD 28. Na/Cl/K/HCO3
      NÃO publicados. Cetonúria "positiva" sem cruzes -> null. HbA1c >16%
      (teto de ensaio). suspectedSepsis=true: febre persistente +
      cerebrite infecciosa + antimicrobianos de amplo espectro. Perfil
      trava por múltiplos eixos — caso de executabilidade extrema com
      desfecho riquíssimo.

conduta_relatada:
  insulina:
    iniciada: true
    adiada_por_potassio: false
    taxa_inicial_U_kg_h: 0.1
    reduzida_com_dextrose: null
    bolus_inicial: false
  potassio:
    reposto_antes_da_insulina: null
    reposto: null
  bicarbonato:
    administrado: null
    ph_no_momento: null
  fluidos:
    texto: "protocolo institucional de CAD pediátrica: fluidos IV + insulina contínua + monitorização eletrolítica; salina hipertônica 3% em bolus x3 por suspeita de edema cerebral"
  texto_livre: >-
    Insulina 0,1 U/kg/h + HTS 3% por alteração persistente do sensório;
    a NÃO-resposta ao manejo padrão de CAD foi o gatilho para investigar
    patologia intracraniana -> mucormicose rinocerebral confirmada
    (Karius/dia 9); anfotericina lipossomal + posaconazol ->
    isavuconazol; craniotomia frontal com drenagem de abscesso fúngico e
    desbridamento. Sem corticoide (não indicado para o COVID dela).

desfecho:
