    observacoes: >-
      Painel completo (gasometria arterial). Cetona sérica publicada como
      ">10 mmol/L" sem nomear o ensaio -> null (F-008); eixo cetônico
      entra pela cetonúria 3+ publicada. Lactato 13,8 mg/dL -> 1,53
      mmol/L (conversão /9,008, massa molar — identidade). AG 36
      relatado (consistente: 140-98-5,9=36,1). K 2,0 (!) com
      hipocalemia. HbA1c 10,4%. Dia 4: pH 7,4, HCO3 23,2, K 3,2,
      cetonas negativas (sem Na/glicose completos -> ponto não incluído).

