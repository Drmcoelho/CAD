    reposto: null
  bicarbonato:
    administrado: null
    ph_no_momento: null
  fluidos:
    texto: "ressuscitação volêmica agressiva por protocolo institucional de HHS"
  texto_livre: >-
    UTI: fluidos agressivos + insulina IV contínua + correção
    eletrolítica. Glicemia normalizou em 12h de infusão; sensório
    retornou ao basal no dia seguinte. Transição para lispro + levemir
    com educação em diabetes.

desfecho:
